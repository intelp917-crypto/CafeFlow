# CafeFlow stack
# Built, started and verified on Docker Desktop (Linux engine) on 2026-11-20:
# both images, health checks, nginx /api proxy, admin login + session cookie,
# daily backup (integrity_check=ok), HTTPS via the optional Caddy profile, and
# data persistence across `down`/`up`. Copy .env.example to .env first —
# SEED_ADMIN_PASSWORD has no default.
#
# Runtime state lives in one volume mounted at /app/data, which is also the
# API's default data root inside the image. The volume is named `data` by
# default so an existing volume with that name is reused; override it with
# DATA_VOLUME_NAME when another name is preferred.

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: quay.io/intelp917/cafeflow-api:0.1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Listen on every interface inside the container so nginx can reach the
      # API by service name; the container is never published directly.
      HOST: "0.0.0.0"
      # Everything that must survive a restart/rebuild lives under this one
      # path. It matches the image's default, so a container started without
      # this variable still writes to the mounted volume.
      CAFEFLOW_DATA_DIR: /app/data
      CAFEFLOW_BACKUP_DIR: /app/data/backups
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cafe_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      # Secure by default. A plain-HTTP trial (no TLS in front) must set this to
      # false explicitly, otherwise the browser never sends the session cookie.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      # No demo accounts in a real installation; the starter menu stays on
      # because products are edited directly in the database for now.
      SEED_DEMO_STAFF: ${SEED_DEMO_STAFF:-false}
      SEED_DEMO_MENU: ${SEED_DEMO_MENU:-true}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      PRINT_BRIDGE_TOKEN: ${PRINT_BRIDGE_TOKEN:-}
    # Migrate and seed before serving: a fresh installation otherwise has no
    # administrator and `main.ts` intentionally never seeds in production.
    # `seed` is skipped once users exist, so restarts keep the live data.
    command: ["sh", "-c", "node dist/db/cli.js migrate && node dist/db/cli.js seed && node dist/main.js"]
    volumes:
      - cafeflow_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: quay.io/intelp917/cafeflow-web:0.1.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Bound to 0.0.0.0 explicitly: the stack is meant to be opened from a phone
    # or another computer on the café's Wi-Fi (http://<server-ip>:8080).
    ports:
      - "0.0.0.0:${WEB_PORT:-8080}:80"

  # Daily consistent copy with the project's own script (VACUUM INTO +
  # integrity check). It reuses the API image, so nothing is downloaded on a
  # café's network at runtime and the copy is taken by SQLite itself.
  backup:
    image: quay.io/intelp917/cafeflow-api:0.1.0
    restart: unless-stopped
    # The fresh backup volume is root-owned, so this one-shot job runs as root
    # (overriding the image's USER node); the API itself stays unprivileged.
    user: "0:0"
    # The image's healthcheck probes an HTTP server this job does not run.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Not :ro — SQLite needs its WAL sidecar files writable to read a live
      # database. The script itself only writes the copy under backups/.
      - cafeflow_data:/app/data
      - cafeflow_backups:/app/data/backups
    environment:
      CAFEFLOW_DATA_DIR: /app/data
      CAFEFLOW_BACKUP_DIR: /app/data/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    command: >
      sh -c "until node /app/scripts/backup.mjs; do
               echo 'backup failed; retrying in 60s'; sleep 60;
             done;
             while true; do sleep 86400; node /app/scripts/backup.mjs || true; done"

  # Optional HTTPS terminator: `docker compose --profile tls up -d`.
  # Local/LAN trials use Caddy's internal CA; a public domain gets a real
  # certificate when CAFEFLOW_TLS holds the ACME e-mail (see Caddyfile).
  proxy:
    image: caddy:2.8-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CAFEFLOW_HOST: ${CAFEFLOW_HOST:-localhost}
      CAFEFLOW_TLS: ${CAFEFLOW_TLS:-internal}
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # The existing `data` volume is adopted by name, so switching from an older
  # stack keeps the database and uploads in one place. Set DATA_VOLUME_NAME in
  # .env to use a different volume.
  cafeflow_data:
    name: ${DATA_VOLUME_NAME:-data}
  cafeflow_backups:
  caddy_data:
  caddy_config:
