# Isolated load-test stack.
#
# It reuses the already-built production images but has its own project name,
# SQLite volume and loopback-only web port. Never point this at the real data
# volume: the 20% write scenario creates thousands of orders.
#
#   LOADTEST_ADMIN_PASSWORD='...' docker compose \
#     -f infra/docker/compose.loadtest.yml up -d api web
#
# The event-loop preload is mounted read-only so the API image stays untouched.

name: cafeflow-loadtest

services:
  api:
    image: quay.io/intelp917/cafeflow-api:0.1.0
    restart: "no"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      CAFEFLOW_DATA_DIR: /app/data
      CAFEFLOW_BACKUP_DIR: /app/data/backups
      SESSION_COOKIE_NAME: cafe_session
      SESSION_COOKIE_SECURE: "false"
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: ${LOADTEST_ADMIN_PASSWORD:?set LOADTEST_ADMIN_PASSWORD}
      SEED_DEMO_STAFF: "true"
      SEED_DEMO_MENU: "true"
      LOGIN_MAX_ATTEMPTS: "1000"
    command:
      - sh
      - -c
      - >-
        node dist/db/cli.js migrate &&
        node dist/db/cli.js seed &&
        node --import /app/loadtest/server-event-loop.mjs dist/main.js
    volumes:
      - loadtest_data:/app/data
      - ../../scripts/loadtest/server-event-loop.mjs:/app/loadtest/server-event-loop.mjs:ro

  web:
    image: quay.io/intelp917/cafeflow-web:0.1.0
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOADTEST_WEB_PORT:-18080}:80"

volumes:
  loadtest_data:
