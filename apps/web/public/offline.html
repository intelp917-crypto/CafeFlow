<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#aa472b" />
    <title>بدون اتصال</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f5f2;
        color: #2b2320;
        font-family: Vazirmatn, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        width: min(26rem, 100%);
        padding: 32px 28px;
        border: 1px solid #e6ded7;
        border-radius: 20px;
        background: #fff;
        text-align: center;
        box-shadow: 0 10px 30px rgb(43 35 32 / 6%);
      }
      .badge {
        width: 64px; height: 64px;
        margin: 0 auto 18px;
        display: grid; place-items: center;
        border-radius: 18px;
        background: #aa472b;
        color: #fff;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 13px; line-height: 2; color: #7a6f68; margin: 0 0 20px; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 10px 22px;
        border: 0;
        border-radius: 12px;
        background: #aa472b;
        color: #fff;
        cursor: pointer;
      }
      small { display: block; margin-top: 16px; font-size: 10px; color: #9a8f87; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M5 9h11a4 4 0 0 1 0 8h-1v2H8v-2H5z" stroke-linejoin="round" />
          <path d="M8 5c0 1.5 1 1.5 1 3M12 5c0 1.5 1 1.5 1 3" stroke-linecap="round" />
        </svg>
      </div>
      <h1>اتصال اینترنت قطع است</h1>
      <p>
        برای نمایش منو و ثبت سفارش به سرور نیاز است. اتصال را بررسی کنید و دوباره تلاش کنید.
        سفارش‌های ثبت‌شده در سرور محفوظ هستند.
      </p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
      <small>سامانه مدیریت کافه و رستوران</small>
    </main>
  </body>
</html>
