name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages, API and web
        run: npm run build

      - name: Run unit and integration tests
        run: npm test

  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace

  rust-postgres:
    name: Rust migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cafeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Apply every PostgreSQL migration and seed
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/cafeflow
          SEED_ADMIN_USERNAME: admin
          SEED_ADMIN_PASSWORD: CafeFlow@1404
          SEED_DEMO_STAFF: "false"
        run: cargo run -p cafeflow-api --bin cafeflow -- db setup
